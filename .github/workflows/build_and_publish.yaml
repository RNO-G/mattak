name: Build and publish

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6

    - name: Set up Python 3.10
      uses: actions/setup-python@v6
      with:
        python-version: "3.10"
        cache: 'pip'

    - name: Install poetry
      run: |
        python -m pip install --upgrade pip
        pip install poetry
      # poetry recommends using curl to install - probably doesn't make a difference though?

    - name: Build mattak # let's always build - maybe this will occasionally catch errors
      run: poetry build

    - name: Check if version is updated
      id: version_check
      run: |
        MATTAK_LATEST_RELEASE=$(pip index versions mattak | grep "Available versions:" | sed "s/^Available versions: *//"| cut -d',' -f1)
        CURRENT_VERSION=$(poetry version -s)
        echo "MATTAK_LATEST_RELEASE=$MATTAK_LATEST_RELEASE"
        echo "CURRENT_VERSION=$CURRENT_VERSION"
        echo "MATTAK_LATEST_RELEASE=$MATTAK_LATEST_RELEASE" >> $GITHUB_OUTPUT
        echo "CURRENT_VERSION=$CURRENT_VERSION" >> $GITHUB_OUTPUT

    - name: Publish distribution 📦 to PyPI
      if: steps.version_check.outputs.CURRENT_VERSION != steps.version_check.outputs.MATTAK_LATEST_RELEASE
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        password: ${{ secrets.PYPI_API_TOKEN }}
        verbose: true

    - name: Make tag and release
      if: steps.version_check.outputs.CURRENT_VERSION != steps.version_check.outputs.MATTAK_LATEST_RELEASE
      env:
        GH_TOKEN: ${{ github.token}}
      run: |
        git config --global user.email "cozzyd@kicp.uchicago.edu"
        git config --global user.name "Cosmin Deaconu"

        export VERSION_NEW="$(poetry version -s)"
        export NEW_TAG=v$VERSION_NEW
        git tag $NEW_TAG -m "$NEW_TAG release"
        git push origin $NEW_TAG

        gh release create $NEW_TAG --generate-notes
